name: Lichess Fairy Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download Fairy-Stockfish to System Path
      run: |
        sudo wget https://github.com/fairy-stockfish/Fairy-Stockfish/releases/download/fairy_sf_14/fairy-stockfish_x86-64-modern -O /usr/local/bin/fairy-stockfish
        sudo chmod +x /usr/local/bin/fairy-stockfish

    - name: Download chess opening book
      run: |
        wget -O book.zip https://github.com/ChrisWhittington/polyglot-books/releases/download/v1.0/book.zip

    - name: Unzip opening book
      run: |
        unzip book.zip -d ./assets/

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        python3 lichess-bot.py &
        BOT_PID=$!
        sleep 16200
        touch LICHESS_BOT_UPGRADE
        wait $BOT_PID
