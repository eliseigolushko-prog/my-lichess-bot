name: Lichess Fairy Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download Fairy-Stockfish to System Path
      run: |
        sudo wget https://github.com/fairy-stockfish/Fairy-Stockfish/releases/download/fairy_sf_14/fairy-stockfish_x86-64-modern -O /usr/local/bin/fairy-stockfish
        sudo chmod +x /usr/local/bin/fairy-stockfish

    - name: Download chess opening book
      run: |
        wget -O book.zip https://github.com/ChrisWhittington/polyglot-books/releases/download/v1.0/book.zip

    - name: Unzip opening book
      run: |
        mkdir -p assets
        unzip book.zip -d ./assets/

    - name: Download NNUE
      run: |

        sudo wget --no-check-certificate https://tests.stockfishchess.org/api/nn/nn-46832cfbead3.nnue -O /usr/local/bin/classical.nnue

        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=1nieguR4yCb0BlME-AUhcrFYkmyIOGvqs&export=download" -O /usr/local/bin/crazyhouse.nnue
        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=1bC7T3iDft8Kbuxlu3Vm2fERxk7cOSoDy&export=download" -O /usr/local/bin/atomic.nnue
        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=1x25r_1PgB5XqttkfR494M4rseiIm0BAV&export=download" -O /usr/local/bin/antichess.nnue
        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=16BQztGqFIS1n_dYtmdfFVE2EexF-KagX&export=download" -O /usr/local/bin/horde.nnue
        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=1Tiq8FqSu7eiekE2iaWQzSdJPg-mhvLzJ&export=download" -O /usr/local/bin/racingkings.nnue
        sudo wget --no-check-certificate "https://drive.google.com/u/0/uc?id=1z5oUQbqiE0ZIoQ8Z64y2lF91Rz1rUoWP&export=download" -O /usr/local/bin/3check.nnue


    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        python3 lichess-bot.py &
        BOT_PID=$!
        sleep 16200
        touch LICHESS_BOT_UPGRADE
        wait $BOT_PID
